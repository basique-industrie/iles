name: Bug report
description: Report a reproducible Iles problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, cookies, account identifiers, or unredacted logs. Report vulnerabilities through the private security-advisory flow.
  - type: input
    id: version
    attributes:
      label: Iles version and build
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and display setup
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
