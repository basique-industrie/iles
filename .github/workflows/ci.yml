name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Shared Basique Industrie Mini (org runner m1-mac-mini).
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build release product
        run: swift build -c release --product Iles
      - name: Test
        run: ./scripts/test.sh
      - name: Public release checks
        run: ./scripts/check-public-release.sh
