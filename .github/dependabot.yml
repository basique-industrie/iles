version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - swift
    commit-message:
      prefix: "chore(deps)"
    groups:
      swift:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Majors stay ungrouped so a checkout 6 → 7 style bump is its own PR
  # and is applied in every workflow, not only CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
